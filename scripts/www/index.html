<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快递到达时间记录</title>
<style>
:root{--bg:#f2f5fa;--card:#fff;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;--border:#e6ecf5;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;}
input,select,textarea,td,th{user-select:text;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:#94a3b8;background-clip:content-box;}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.titlebar{flex:0 0 58px;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 20px;background:linear-gradient(90deg,#1e293b 0%,#26344c 100%);border-bottom:1px solid rgba(255,255,255,.07);}
/* 关键修改：让顶部区域可拖拽 */
.brand, .brand > div, .titlebar { -webkit-app-region: drag; }
/* 关键修改：让按钮不可拖拽，否则点不到 */
.titlebar-right, .win-controls, .win-btn, .badge { -webkit-app-region: no-drag; }

.brand{display:flex;align-items:center;gap:12px;}
.brand-logo{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,#3b82f6,#6366f1);box-shadow:0 4px 12px rgba(59,130,246,.45);}
.brand-name{font-size:15px;font-weight:600;color:#f1f5f9;letter-spacing:.4px;line-height:1.2;}
.brand-sub{font-size:11px;color:#7d8ca6;letter-spacing:.6px;margin-top:2px;}
.titlebar-right{display:flex;align-items:center;gap:8px;}
.badge{font-size:12px;color:#cbd5e1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);padding:5px 13px;border-radius:20px;}
.win-controls{display:flex;gap:2px;margin-left:6px;}
.win-btn{width:38px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:transparent;color:#cbd5e1;font-size:14px;border:none;cursor:pointer;transition:all .15s;font-family:inherit;line-height:1;}
.win-btn:hover{background:rgba(255,255,255,.12);color:#fff;}
.win-btn.close:hover{background:#e81123;color:#fff;}
.body{flex:1;display:flex;min-height:0;}
.sidebar{width:210px;flex:0 0 210px;display:flex;flex-direction:column;background:linear-gradient(180deg,#0f172a 0%,#182032 100%);padding:16px 11px 14px;border-right:1px solid rgba(0,0,0,.2);overflow-y:auto;}
.nav-label{font-size:11px;color:#5b6b85;letter-spacing:1.5px;padding:4px 12px 8px;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:9px;color:#94a3b8;font-size:13.5px;border:1px solid transparent;white-space:nowrap;margin-bottom:4px;cursor:pointer;transition:all .18s;}
.nav-item:hover{color:#cbd5e1;background:rgba(255,255,255,.04);}
.nav-item.active{background:linear-gradient(90deg,rgba(59,130,246,.26),rgba(99,102,241,.12));color:#fff;border-color:rgba(96,165,250,.35);box-shadow:0 3px 12px rgba(0,0,0,.3);}
.nav-item .ico{width:18px;text-align:center;font-size:15px;}
.side-btn{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:9px;font-size:13px;cursor:pointer;border:1px solid transparent;transition:all .18s;background:transparent;text-align:left;color:#94a3b8;margin-bottom:8px;font-family:inherit;}
.side-btn .ico{width:18px;text-align:center;font-size:14px;}
.side-btn.green{color:#34d399;border-color:rgba(52,211,153,.3);}
.side-btn.green:hover{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.55);}
.side-btn.blue{color:#60a5fa;border-color:rgba(96,165,250,.3);}
.side-btn.blue:hover{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.55);}
.side-btn.orange{color:#fbbf24;border-color:rgba(251,191,36,.3);}
.side-btn.orange:hover{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.55);}
.side-btn.red{color:#f87171;border-color:rgba(248,113,113,.3);}
.side-btn.red:hover{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.6);}
.side-btn.purple{color:#a78bfa;border-color:rgba(167,139,250,.32);}
.side-btn.purple:hover{background:rgba(167,139,250,.13);border-color:rgba(167,139,250,.6);}
.sidebar-footer{margin-top:auto;padding:12px 13px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);color:#5b6b85;font-size:11px;line-height:1.8;}
.content{flex:1;min-width:0;overflow-y:auto;padding:18px 20px 26px;scroll-behavior:smooth;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.03);}
.card-head{display:flex;align-items:center;gap:9px;margin-bottom:15px;flex-wrap:wrap;}
.card-head .dot{width:3px;height:15px;border-radius:2px;background:linear-gradient(180deg,#3b82f6,#6366f1);}
.card-title{font-size:14px;font-weight:600;color:#1e293b;letter-spacing:.3px;}
.card-head .toolbar{margin-left:auto;display:flex;align-items:center;gap:8px;}
.card-head.clickable{cursor:pointer;user-select:none;}
.card-head.clickable:hover .card-title{color:#2563eb;}
.collapse-arrow{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;background:#f1f5fb;color:#64748b;font-size:10px;transition:transform .2s,background .2s;margin-left:2px;}
.collapse-arrow.open{transform:rotate(90deg);background:#e0ecff;color:#2563eb;}
.search-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.search-input{position:relative;flex:1;min-width:200px;display:flex;align-items:center;}
.search-input .s-ico{position:absolute;left:12px;font-size:13px;color:#94a3b8;pointer-events:none;}
.search-input input[type=text]{width:100%;padding-left:36px;}
.count{font-size:12.5px;color:var(--text3);padding-left:4px;}
.search-results{margin-top:14px;border:1px solid var(--border);border-radius:10px;background:#fbfcfe;height:320px;overflow:auto;position:relative;}
.sr-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#a8b4c5;font-size:13px;text-align:center;padding:0 20px;line-height:1.7;}
.sr-empty .sr-ico{font-size:30px;opacity:.4;}
.sr-head{padding:9px 14px;font-size:12.5px;color:#475569;border-bottom:1px solid var(--border);background:#f7f9fc;}
.sr-head b{color:#2563eb;}
.sr-head code{background:#eef3fb;padding:1px 7px;border-radius:4px;color:#2563eb;font-size:12px;}
.sr-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
.sr-table thead th{position:sticky;top:0;z-index:2;background:#f7f9fc;color:#475569;font-weight:600;font-size:12.5px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
.sr-table tbody td{padding:9px 12px;border-bottom:1px solid #f2f5fa;color:#334155;}
.sr-table tbody tr:last-child td{border-bottom:none;}
.sr-table tbody tr:hover td{background:#f2f9ff;}
.sr-table tr.row-editing td{background:#fffbeb !important;}
.sr-table tr.row-editing td:first-child{box-shadow:inset 3px 0 0 #f59e0b;}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px 16px;}
.form-item{display:flex;flex-direction:column;gap:6px;min-width:0;}
.form-item label{font-size:12.5px;color:var(--text2);font-weight:500;}
.form-item.wide{grid-column:span 2;}
.form-item.full{grid-column:1/-1;}
input[type=text],select{width:100%;border:1px solid #dbe3ef;border-radius:7px;padding:8px 11px;font-size:13px;outline:none;font-family:inherit;background:#fff;color:var(--text);transition:border-color .15s,box-shadow .15s;}
input[type=text]:hover,select:hover{border-color:#b9c6dc;}
input[type=text]:focus,select:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.13);}
input[type=text]::placeholder{color:#b0bccc;}
select{cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%2364748b'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 11px center;padding-right:30px;}
#dupHint{font-size:12px;min-height:0;line-height:1.5;}
.form-actions{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;}
.edit-tip{font-size:12.5px;color:#f59e0b;font-weight:600;}
button{font-family:inherit;font-size:13px;border-radius:7px;cursor:pointer;transition:all .16s;border:1px solid transparent;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;padding:8px 20px;font-weight:500;box-shadow:0 2px 9px rgba(37,99,235,.3);}
.btn-primary:hover{filter:brightness(1.08);box-shadow:0 4px 14px rgba(37,99,235,.4);}
.btn-primary:active{transform:translateY(1px);}
.btn-default{background:#fff;color:#334155;border-color:#dbe3ef;padding:8px 16px;}
.btn-default:hover{border-color:#94a3b8;background:#f8fafc;color:#1e293b;}
.btn-danger{background:#fff;color:#ef4444;border-color:#fecaca;padding:8px 16px;}
.btn-danger:hover{background:#fef2f2;border-color:#f87171;}
.btn-sm{padding:5px 12px;font-size:12px;}
.table-wrap{max-height:480px;min-height:200px;overflow:auto;border:1px solid var(--border);border-radius:10px;}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
thead th{position:sticky;top:0;z-index:2;background:#f7f9fc;color:#475569;font-weight:600;font-size:12.5px;text-align:left;padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:10px 12px;border-bottom:1px solid #f2f5fa;color:#334155;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#f7fbff;}
tr.row-editing td{background:#fffbeb !important;}
tr.row-editing td:first-child{box-shadow:inset 3px 0 0 #f59e0b;}
.empty{text-align:center;color:#a8b4c5;padding:40px 0 !important;font-size:13px;}
.tag-am{color:#2563eb;font-weight:600;}
.tag-pm{color:#ea580c;font-weight:600;}
.tag-noon{color:#7c3aed;font-weight:600;}
.link-btn{background:none;border:none;padding:3px 8px;font-size:12.5px;border-radius:5px;cursor:pointer;}
.link-btn.edit{color:#2563eb;}
.link-btn.edit:hover{background:#eff6ff;}
.link-btn.del{color:#ef4444;}
.link-btn.del:hover{background:#fef2f2;}
@media (max-width:960px){.form-grid{grid-template-columns:repeat(2,1fr);}.form-item.wide{grid-column:span 2;}}
@media (max-width:760px){.sidebar{width:64px;flex:0 0 64px;padding:16px 8px;}.nav-item span:not(.ico){display:none;}.nav-item{justify-content:center;padding:12px 0;}.side-btn span:not(.ico){display:none;}.side-btn{justify-content:center;padding:11px 0;}.nav-label,.sidebar-footer{display:none;}.brand-sub{display:none;}.badge{display:none;}}
/* 地址粘贴识别区（醒目高亮） */
.paste-box{position:relative;background:linear-gradient(135deg,#eaf3ff,#dbeaff);border:2px dashed #6aa8f7;border-radius:10px;padding:13px 16px 13px 21px;transition:all .2s;box-shadow:0 3px 12px rgba(59,130,246,.12);}
.paste-box::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,#3b82f6,#6366f1);}
.paste-box:hover{border-color:#3b82f6;box-shadow:0 4px 16px rgba(59,130,246,.2);}
.paste-box.has-result{border-style:solid;border-color:#34d399;background:linear-gradient(135deg,#eafaf1,#d7f5e6);box-shadow:0 3px 14px rgba(16,185,129,.18);}
.paste-box.has-result::before{background:linear-gradient(180deg,#10b981,#34d399);}
.paste-label{display:block;margin-bottom:9px;font-size:13px;color:#1d4ed8;font-weight:700;letter-spacing:.2px;}
.paste-box.has-result .paste-label{color:#047857;}
.paste-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.paste-row input[type=text]{flex:1;min-width:180px;background:#fff;border-color:#9fc4f0;}
.paste-row input[type=text]:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.16);}
.paste-row input[type=text]::placeholder{color:#8fadd4;}
.paste-hint{font-size:12px;line-height:1.5;display:block;margin-top:7px;color:#64748b;font-weight:600;}
.paste-hint:empty{display:none;}
/* 自定义弹窗 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
/* 【修复】自定义确认框需要显示在快递公司管理弹窗之上，提升层级 */
#customModal{z-index:10000;}
.modal-box{background:#fff;border-radius:14px;width:520px;max-width:92vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 40px -10px rgba(0,0,0,.4);transform:translateY(10px);transition:transform .2s;}
.modal-overlay.show .modal-box{transform:translateY(0);}
.modal-head{padding:16px 20px;border-bottom:1px solid #e2e8f0;font-size:16px;font-weight:700;color:#1e293b;display:flex;align-items:center;gap:8px;background:#f8fafc;border-radius:14px 14px 0 0;}
.modal-body{padding:20px;overflow-y:auto;font-size:14px;color:#334155;line-height:1.6;}
.modal-foot{padding:14px 20px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:10px;background:#f8fafc;border-radius:0 0 14px 14px;}
.modal-highlight{color:#ef4444;font-weight:700;background:#fef2f2;padding:2px 8px;border-radius:6px;font-size:15px;}
.modal-record-list{margin:12px 0;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:0 12px;box-shadow:inset 0 1px 3px rgba(0,0,0,.02);}
.modal-record-item{padding:12px 0;border-bottom:1px dashed #cbd5e1;font-size:14px;line-height:1.7;}
.modal-record-item:last-child{border-bottom:none;}
.modal-record-item .r-id{color:#2563eb;font-weight:700;margin-right:6px;}
.modal-record-item .r-courier{color:#0f172a;font-weight:700;margin-right:6px;}
.modal-record-item .r-address{color:#475569;margin-right:6px;}
.modal-record-item .r-time{color:#ea580c;font-weight:700;background:#fff7ed;padding:1px 6px;border-radius:4px;margin-right:6px;border:1px solid #ffedd5;}
.modal-record-item .r-kw{color:#64748b;font-size:13px;display:block;margin-top:4px;}
/* 快递公司管理 */
.courier-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid #e6ecf5;border-radius:8px;margin-bottom:6px;background:#fbfcfe;font-size:13.5px;color:#334155;}
.courier-item:hover{background:#f2f9ff;border-color:#cfe0f7;}
.courier-item:last-child{margin-bottom:0;}
.courier-empty{text-align:center;color:#a8b4c5;font-size:13px;padding:22px 0;line-height:1.8;}
.courier-count{font-size:12.5px;color:#64748b;margin-bottom:8px;}
.courier-count b{color:#2563eb;}
/* 准确率百分比 & 聚合次数徽标 */
.pct-badge{display:inline-block;margin-left:6px;background:#ecfdf5;color:#059669;border:1px solid #a7f3d0;font-size:11px;padding:1px 6px;border-radius:10px;font-weight:700;vertical-align:middle;}
.count-badge{display:inline-block;margin-left:6px;background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;font-size:11px;padding:1px 6px;border-radius:10px;font-weight:700;vertical-align:middle;}
</style>
</head><body>
<div class="app">
  <header class="titlebar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <div class="brand-logo">📦</div>
      <div data-tauri-drag-region>
        <div class="brand-name">快递到达时间记录</div>
        <div class="brand-sub">EXPRESS ARRIVAL RECORDER</div>
      </div>
    </div>
    <div class="titlebar-right">
      <span class="badge" id="recordBadge">0 条记录</span>
      <div class="win-controls" id="winControls">
        <!-- 注意：这里添加了 id，方便 JS 绑定 -->
        <button class="win-btn" id="btn-min" title="最小化">—</button>
        <button class="win-btn" id="btn-max" title="最大化/还原">□</button>
        <button class="win-btn close" id="btn-close" title="关闭">✕</button>
      </div>
    </div>
  </header>
  <div class="body">
    <nav class="sidebar">
      <div class="nav-label">功能菜单</div>
      <div class="nav-item active" id="navSearch" onclick="switchNav('searchCard','navSearch')"><span class="ico">🔍</span><span>按关键词查询</span></div>
      <div class="nav-item" id="navEntry" onclick="switchNav('entryCard','navEntry')"><span class="ico">📝</span><span>录入信息</span></div>
      <div class="nav-item" id="navList" onclick="switchNav('listCard','navList')"><span class="ico">🚚</span><span>时效查询</span></div>
      <div class="nav-label" style="margin-top:14px;">数据操作</div>
      <button class="side-btn purple" onclick="openCourierManager()"><span class="ico">🏷️</span><span>快递公司管理</span></button>
      <button class="side-btn green" onclick="exportToFile()"><span class="ico">📤</span><span>导出数据</span></button>
      <button class="side-btn blue" onclick="document.getElementById('importFile').click()"><span class="ico">📥</span><span>导入数据</span></button>
      <button class="side-btn orange" onclick="copyBackup()"><span class="ico">📋</span><span>复制备份数据</span></button>
      <button class="side-btn red" onclick="clearAll()"><span class="ico">🗑️</span><span>清空全部记录</span></button>
      <div class="sidebar-footer">
        数据保存在本机<br>
        <span style="color:#3d4b63">建议定期导出备份 · v1.7.0</span>
      </div>
    </nav>
    <main class="content">
      <div class="card" id="searchCard">
        <div class="card-head">
          <span class="dot"></span><span class="card-title">按关键词查询</span>
          <div class="toolbar"><span class="count" id="count">共 0 条记录</span></div>
        </div>
        <div class="search-bar">
          <div class="search-input">
            <span class="s-ico">🔍</span>
            <input type="text" id="searchKw" placeholder="输入省 / 市 / 区 / 街道 / 备注 / 快递公司等关键词...">
          </div>
          <button class="btn-primary" onclick="doSearch()">查询</button>
          <button class="btn-default" onclick="resetSearch()">清除</button>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="card" id="entryCard">
        <div class="card-head">
          <span class="dot"></span>
          <span class="card-title" id="formCardTitle">录入信息</span>
          <span class="edit-tip" id="editTip"></span>
        </div>
        <div class="form-grid">
          <div class="form-item full">
            <div class="paste-box" id="pasteBox">
              <label class="paste-label">📋 粘贴完整地址（自动识别省 / 市 / 区县，剩余内容自动填入详细地址）</label>
              <div class="paste-row">
                <input type="text" id="pasteAddr" placeholder="例如：四川省 成都市 龙泉驿区 龙泉街道 科技园南路xx号（粘贴后自动识别）">
                <button class="btn-default btn-sm" type="button" onclick="clearPasteAddr()">清除</button>
              </div>
              <span class="paste-hint" id="parseHint"></span>
            </div>
          </div>
          <div class="form-item">
            <label>快递公司</label>
            <select id="courier"></select>
          </div>
          <div class="form-item">
            <label>时效</label>
            <select id="duration">
              <option value="1天">1天</option><option value="2天">2天</option><option value="3天">3天</option>
              <option value="4天">4天</option><option value="5天">5天</option><option value="6天">6天</option><option value="7天">7天</option>
            </select>
          </div>
          <div class="form-item">
            <label>到达时间</label>
            <select id="period">
              <option value="上午">上午</option>
              <option value="中午">中午（11:00-13:00）</option>
              <option value="下午">下午</option>
            </select>
          </div>
          <div class="form-item"><label>省</label><select id="province"></select></div>
          <div class="form-item"><label>市</label><select id="city"></select></div>
          <div class="form-item"><label>区 / 县</label><select id="district"></select></div>
          <div class="form-item full">

const RAW_REGION = RAW_REGION_P1 + '\n' + RAW_REGION_P2;

const REGION_DATA = {};
RAW_REGION.trim().split('\n').forEach(line => {
  const parts = line.split('|');
  if (parts.length < 3) return;
  const p = parts[0].trim(), c = parts[1].trim(), ds = parts[2].trim();
  if (!p || !c) return;
  if (!REGION_DATA[p]) REGION_DATA[p] = {};
  REGION_DATA[p][c] = ds ? ds.split(',').map(s => s.trim()).filter(Boolean) : [];
});

const STORAGE_KEY = 'express_arrive_records_v3';
const COURIER_KEY = 'express_courier_list_v1';
let editingId = null, listCollapsed = true;

/* ============================================================
 * 聚合与准确率核心
 * 唯一键（判断"完全一致"）：快递公司+省+市+区县+街道+时效+到达时间
 * 分组键（计算准确率分母）：快递公司+省+市+区县+街道+时效
 * ============================================================ */
const KEY_SEP = '\u0001';
function uniqueKeyOf(r){
  return [r.courier||'', r.province||'', r.city||'', r.district||'', r.street||'', r.duration||'', r.period||''].join(KEY_SEP);
}
function groupKeyOf(r){
  return [r.courier||'', r.province||'', r.city||'', r.district||'', r.street||'', r.duration||''].join(KEY_SEP);
}
/* 把可能存在的完全一致记录合并为一条，count 累加 */
function aggregateRecords(list){
  const map = new Map();
  const order = [];
  list.forEach(r => {
    const k = uniqueKeyOf(r);
    if(!map.has(k)){
      map.set(k, Object.assign({}, r, {count: Number(r.count)||1}));
      order.push(k);
    }else{
      const ex = map.get(k);
      ex.count = (Number(ex.count)||1) + (Number(r.count)||1);
      if(!ex.keyword && r.keyword) ex.keyword = r.keyword;
      if(r.updatedAt && (!ex.updatedAt || String(r.updatedAt) > String(ex.updatedAt))) ex.updatedAt = r.updatedAt;
    }
  });
  return order.map(k => map.get(k)).sort((a,b) => (Number(a.id)||0)-(Number(b.id)||0));
}
/* 百分比 Map：唯一键 -> 准确率百分比数值（保留一位小数） */
function getPercentMap(){
  const list = loadData();
  const totals = new Map();
  list.forEach(r => {
    const gk = groupKeyOf(r);
    totals.set(gk, (totals.get(gk)||0) + (Number(r.count)||1));
  });
  const result = new Map();
  list.forEach(r => {
    const uk = uniqueKeyOf(r);
    const gk = groupKeyOf(r);
    const total = totals.get(gk)||1;
    const cnt = Number(r.count)||1;
    result.set(uk, Math.round(cnt/total*1000)/10);
  });
  return result;
}
function formatPercent(p){
  if(p===undefined || p===null) return '';
  const n = Number(p);
  if(!isFinite(n)) return '';
  return (Number.isInteger(n) ? n : n.toFixed(1)) + '%';
}

}

/* 统计快递公司出现次数（按 count 加权） */
function getCourierFreqMap(){
  const map = new Map();
  loadData().forEach(r=>{
    const name = (r.courier||'').trim();
    if(name) map.set(name, (map.get(name)||0) + (Number(r.count)||1));
  });
  return map;
}
function refreshCourierOptions(selected){
  const sel = document.getElementById('courier');
  if(!sel) return;
  const cur = (selected !== undefined && selected !== null) ? selected : sel.value;
  const names = loadCouriers().slice();
  if(cur && String(cur).trim() && !names.includes(cur)) names.push(cur);
  const freq = getCourierFreqMap();
  names.sort((a,b)=>{
    const fa = freq.get(a)||0, fb = freq.get(b)||0;
    if(fa !== fb) return fb - fa;
    return String(a).localeCompare(String(b),'zh-CN');
  });
  sel.innerHTML = '';
  if(!names.length){
    const o = document.createElement('option');
    o.value = '';
    o.textContent = '（暂无快递公司，请先点左侧「快递公司管理」添加）';
    sel.appendChild(o);
    return;
  }
  names.forEach(n => {
    const o = document.createElement('option');
    o.value = n; o.textContent = n;
    sel.appendChild(o);
  });
  sel.value = (cur && names.includes(cur)) ? cur : names[0];
}

/* 读取数据时自动聚合：保证每条完全一致记录只保留一条 */
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(arr)) return [];
    return aggregateRecords(arr);
  }catch(e){ return []; }
}
function saveData(list){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
  catch(e){ alert('保存失败：存储不可用'); }
}
function buildFreq(getter,filter){
  const map = new Map();
  loadData().forEach(r=>{
    if(filter && !filter(r)) return;
    const k = getter(r);
    if(k) map.set(k, (map.get(k)||0) + (Number(r.count)||1));
  });
  return map;
}
function sortByFreq(names,freqMap){return names.slice().sort((a,b)=>{const fa=freqMap.get(a)||0,fb=freqMap.get(b)||0;if(fa!==fb)return fb-fa;return String(a).localeCompare(String(b),'zh-CN');});}
function setSelectValue(sel,val){if(!sel)return;if(val===undefined||val===null||val===''){sel.value='';return;}const has=Array.from(sel.options).some(o=>o.value===val);if(!has){const o=document.createElement('option');o.value=val;o.textContent=val;sel.appendChild(o);}sel.value=val;}
function fillOptions(sel,items,placeholder,valueKey){sel.innerHTML='';const ph=document.createElement('option');ph.value='';ph.textContent=placeholder;sel.appendChild(ph);items.forEach(item=>{const o=document.createElement('option');if(typeof item==='object'&&item!==null&&valueKey){o.value=item[valueKey];o.textContent=item.label;}else{o.value=item;o.textContent=item;}sel.appendChild(o);});}

/* 录入时的实时提示：只在「完全一致」时提示聚合 */
function updateDupHint(){
  const hint = document.getElementById('dupHint');
  if(!hint) return;
  const c = {
    courier: document.getElementById('courier').value,
    province: document.getElementById('province').value,
    city: document.getElementById('city').value,
    district: document.getElementById('district').value,
    street: document.getElementById('street').value.trim(),
    duration: document.getElementById('duration').value,
    period: document.getElementById('period').value,
    keyword: document.getElementById('keyword').value.trim()
  };
  if(!c.street && !c.keyword && !c.courier){ hint.textContent=''; return; }
  const uk = uniqueKeyOf(c);
  const matches = loadData().filter(r => uniqueKeyOf(r)===uk && (editingId==null || r.id!==editingId));
  if(matches.length>0){
    const total = matches.reduce((s,r)=>s+(Number(r.count)||1),0);
    hint.textContent = '⚠️ 已有完全一致的记录（已出现 '+total+' 次），保存时将自动聚合并更新准确率';
    hint.style.color = '#ff4d4f';
  }else{
    hint.textContent = '';
  }
}

function fillCitySelect(prov,selected){const sel=document.getElementById('city');if(!prov||!REGION_DATA[prov]){fillOptions(sel,[],'请选择市');return;}const freq=buildFreq(r=>r.city,r=>r.province===prov);fillOptions(sel,sortByFreq(Object.keys(REGION_DATA[prov]),freq),'请选择市');if(selected&&REGION_DATA[prov][selected])sel.value=selected;}
function fillDistrictSelect(prov,city,selected){const sel=document.getElementById('district');if(!prov||!city||!REGION_DATA[prov]||!REGION_DATA[prov][city]){fillOptions(sel,[],'请选择区/县');return;}const districts=REGION_DATA[prov][city];const freq=buildFreq(r=>r.district,r=>r.province===prov&&r.city===city);const names=sortByFreq(districts,freq);fillOptions(sel,names,'请选择区/县');if(selected&&names.includes(selected))sel.value=selected;}

/* ===== 地址粘贴自动识别 ===== */
function normalizeAddrText(s){
  return String(s||'')
    .replace(/[\u3000]/g,' ')
    .replace(/[，,、;；\/\\|]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function findBestRegionMatch(text,candidates){
  let best=null;
  (candidates||[]).forEach(name=>{
    if(!name)return;
    let idx=text.indexOf(name);
    let matchedText=name;
    if(idx<0){
      const short=name.replace(/(特别行政区|自治区|自治州|地区|省|市|盟|区|县|旗)$/,'');
      if(short.length>=2){ idx=text.indexOf(short); matchedText=short; }
    }
    if(idx>=0 && (!best || matchedText.length>best.matched.length)){
      best={name:name,matched:matchedText,index:idx};
    }
  });
  return best;
}
let pasteParseTimer=null;
function scheduleParsePaste(){
  if(pasteParseTimer)clearTimeout(pasteParseTimer);
  pasteParseTimer=setTimeout(function(){pasteParseTimer=null;parsePastedAddress();},300);
}
function parsePastedAddress(){
  if(pasteParseTimer){clearTimeout(pasteParseTimer);pasteParseTimer=null;}
  const input=document.getElementById('pasteAddr');
  const hint=document.getElementById('parseHint');
  const box=document.getElementById('pasteBox');
  const raw=input.value.trim();
  if(!raw){hint.textContent='';box.classList.remove('has-result');return;}
  const text=normalizeAddrText(raw);
  const mProv=findBestRegionMatch(text,Object.keys(REGION_DATA));
  let mCity=null,mDist=null;
  if(mProv&&REGION_DATA[mProv.name]){
    mCity=findBestRegionMatch(text,Object.keys(REGION_DATA[mProv.name]));
    if(mCity&&REGION_DATA[mProv.name][mCity.name]){
      mDist=findBestRegionMatch(text,REGION_DATA[mProv.name][mCity.name]);
    }
  }
  if(mProv){
    fillProvinceSelect(mProv.name);
    const prov=document.getElementById('province').value;
    fillCitySelect(prov,mCity?mCity.name:'');
    const city=document.getElementById('city').value;
    fillDistrictSelect(prov,city,mDist?mDist.name:'');
  }
  const last=mDist||mCity||mProv;
  let detail='';
  if(last){
    detail=text.slice(last.index+last.matched.length).trim();
    if(detail)document.getElementById('street').value=detail;
  }
  updateDupHint();
  const parts=[];
  if(mProv)parts.push('省：'+mProv.name);
  if(mCity)parts.push('市：'+mCity.name);
  if(mDist)parts.push('区县：'+mDist.name);
  if(detail)parts.push('详细地址：'+detail);
  if(parts.length){
    hint.textContent='✅ 已自动识别 '+parts.join(' / ');
    hint.style.color='#15803d';
    box.classList.add('has-result');
  }else{
    hint.textContent='未识别到匹配的省/市/区县，请检查粘贴内容或手动选择。';
    hint.style.color='#ea580c';
    box.classList.remove('has-result');
  }
}

  const hint=document.getElementById('parseHint');

  document.getElementById('pasteBox').classList.remove('has-result');

/* ===== 时效选项按历史使用频率排序，默认选最高频 ===== */
function refreshDurationOptions(){
  const sel=document.getElementById('duration');
  const base=['1天','2天','3天','4天','5天','6天','7天'];
  const freq=buildFreq(r=>r.duration);
  const sorted=base.slice().sort((a,b)=>{
    const fa=freq.get(a)||0, fb=freq.get(b)||0;
    if(fa!==fb)return fb-fa;
    return base.indexOf(a)-base.indexOf(b);
  });
  sel.innerHTML='';
  sorted.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);});
  sel.value=sorted[0];
}

/* ===== 保存：完全一致时弹聚合提醒，否则直接新增/更新 ===== */
function saveRecord(){
  const courier=document.getElementById('courier').value;
  const prov=document.getElementById('province').value;
  const city=document.getElementById('city').value;
  const dist=document.getElementById('district').value;
  const street=document.getElementById('street').value.trim();
  const duration=document.getElementById('duration').value;
  const period=document.getElementById('period').value;
  const kw=document.getElementById('keyword').value.trim();
  if(!courier){alert('请先在「快递公司管理」中添加并选择快递公司');return;}
  if(!prov&&!city&&!dist&&!street&&!kw){alert('请至少选择省/市/区或填写地址、关键词');return;}
  const cand={courier,province:prov,city,district:dist,street,duration,period,keyword:kw};
  const uk=uniqueKeyOf(cand);
  const list=loadData();
  const existing=list.find(r=>uniqueKeyOf(r)===uk && (editingId==null || r.id!==editingId));
  const isEditing=editingId!=null, editId=editingId;

  if(existing){
    const existCnt=Number(existing.count)||1;
    const editRec=isEditing?list.find(r=>r.id===editId):null;
    const editCnt=editRec?(Number(editRec.count)||1):1;
    const newCnt=existCnt+editCnt;
    let html='<div style="margin-bottom:12px;font-size:15px;">⚠️ 发现 <span class="modal-highlight">完全一致</span> 的记录：</div>';
    html+='<div class="modal-record-list">';
    html+='<div class="modal-record-item">'
      +'<span class="r-id">#'+esc(existing.id)+'</span>'
      +'<span class="r-courier">'+esc(existing.courier)+'</span>'
      +'<span class="r-address">'+esc([existing.province,existing.city,existing.district,existing.street].filter(Boolean).join(' '))+'</span>'
      +'<span class="r-time">'+esc(existing.duration)+' '+esc(existing.period)+'</span>'
      +'<span class="r-kw">已出现 '+(Number(existing.count)||1)+' 次</span>'
      +'</div>';
    html+='</div>';
    html+='<div style="margin-top:12px;font-weight:600;color:#1e293b;font-size:14px;">该信息已存在，继续保存将自动聚合（不新增行），聚合后出现 <b>'+(newCnt)+'</b> 次。</div>';
    html+='<div style="margin-top:12px;font-weight:600;color:#1e293b;">是否继续保存？</div>';
    html+='<div style="color:#64748b;font-size:13px;margin-top:6px;background:#f8fafc;padding:10px;border-radius:6px;border:1px solid #e2e8f0;">点击「确定」= 聚合到已有记录<br>点击「取消」= 不保存，保留当前表单</div>';
    showCustomConfirm('⚠️ 完全一致记录提醒',html,
      ()=>{ executeAggregate(existing.id, cand, isEditing, editId); },
      ()=>{}
    );
    return;
  }
  executeSave(cand,isEditing,editId);
}

/* 聚合：把当前录入（或编辑）的次数累加到已有记录上 */
function executeAggregate(targetId, cand, isEditing, editId){
  const list=loadData();
  let addCnt=1;
  if(isEditing){
    const eIdx=list.findIndex(r=>r.id===editId);
    if(eIdx!==-1){
      addCnt=Number(list[eIdx].count)||1;
      list.splice(eIdx,1);
    }
  }
  const tIdx=list.findIndex(r=>r.id===targetId);
  if(tIdx===-1){ executeSave(cand,false,null); return; }
  list[tIdx].count=(Number(list[tIdx].count)||1)+addCnt;
  if(!list[tIdx].keyword && cand.keyword) list[tIdx].keyword=cand.keyword;
  list[tIdx].updatedAt=new Date().toLocaleString('zh-CN');
  saveData(reindexRecords(list));
  clearForm();
  refreshAll();
  refreshCourierOptions();
}

function executeSave(cand,isEditing,editId){
  const list=loadData();
  if(isEditing){
    const idx=list.findIndex(r=>r.id===editId);
    if(idx===-1){alert('要编辑的记录已不存在');clearForm();refreshAll();return;}
    const oldCnt=Number(list[idx].count)||1;
    list[idx]=Object.assign({},list[idx],cand,{count:oldCnt,updatedAt:new Date().toLocaleString('zh-CN')});
    saveData(list);
    clearForm();
    refreshAll();
    refreshCourierOptions();
  }else{
    const maxId=list.reduce((m,r)=>Math.max(m,Number(r.id)||0),0);
    list.push(Object.assign({id:maxId+1,count:1},cand,{createdAt:new Date().toLocaleString('zh-CN')}));
    saveData(list);
    clearForm();
    refreshAll();
    refreshCourierOptions();
  }
}

function deleteRecord(id){
  const rec = loadData().find(r => r.id === id);
  const desc = rec ? esc([rec.courier, rec.province, rec.city, rec.district, rec.street].filter(Boolean).join(' ')) : '';
  showCustomConfirm(
    '删除记录',
    '<div>确定删除记录 <span class="modal-highlight">#'+esc(id)+'</span> 吗？</div>'
    + (desc ? '<div style="color:#64748b;font-size:13px;margin-top:8px;">'+desc+'</div>' : ''),
    function(){ doDeleteRecord(id); },
    null, '删除', '取消'
  );
}
function doDeleteRecord(id){
  const oldEditing=editingId;
  const list=loadData().filter(r=>r.id!==id);
  saveData(reindexRecords(list));
  if(oldEditing===id){
    editingId=null;
    clearForm();
  }else{
    if(oldEditing!=null){
      editingId = oldEditing>id ? oldEditing-1 : oldEditing;
      updateEditUI();
    }
    resortRegionSelects();
  }
  refreshAll();
  refreshCourierOptions();
}

function copyBackup(){const list=loadData();if(!list.length){alert('当前没有记录可复制');return;}const jsonStr=JSON.stringify(list,null,2);const okTip='已复制 '+list.length+' 条记录到剪贴板。\n可粘贴到记事本并保存为 .json 文件作为备份。';const fb=()=>{try{const ta=document.createElement('textarea');ta.value=jsonStr;ta.style.position='fixed';ta.style.top='-9999px';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();const ok=document.execCommand('copy');document.body.removeChild(ta);if(ok)alert(okTip);else alert('复制失败，请改用「导出数据」按钮。');}catch(e){alert('复制失败，请改用「导出数据」按钮。');}};if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){navigator.clipboard.writeText(jsonStr).then(()=>alert(okTip)).catch(fb);}else fb();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sortByIdDesc(list){return list.slice().sort((a,b)=>(Number(b.id)||0)-(Number(a.id)||0));}

/* 表格行渲染：时间后面显示聚合次数（若>1）与准确率百分比 */
function rowsHtml(list, percentMap){
  if(!percentMap) percentMap = getPercentMap();
  return list.map(r=>{
    const uk=uniqueKeyOf(r);
    const pct=percentMap.get(uk);
    const pctText=formatPercent(pct);
    const cnt=Number(r.count)||1;
    const cntBadge=cnt>1?'<span class="count-badge">×'+cnt+'</span>':'';
    const pctBadge=pctText?'<span class="pct-badge">'+pctText+'</span>':'';
    return '<tr class="'+(r.id===editingId?'row-editing':'')+'">'
      +'<td>'+esc(r.id)+'</td>'
      +'<td>'+esc(r.courier)+'</td>'
      +'<td>'+esc(r.province)+'</td>'
      +'<td>'+esc(r.city)+'</td>'
      +'<td>'+esc(r.district)+'</td>'
      +'<td>'+esc(r.street)+'</td>'
      +'<td>'+esc(r.duration)+'</td>'
      +'<td class="'+(r.period==='上午'?'tag-am':(r.period==='中午'?'tag-noon':'tag-pm'))+'">'+esc(r.period)+cntBadge+pctBadge+'</td>'
      +'<td>'+esc(r.keyword)+'</td>'
      +'<td><button class="link-btn edit" onclick="editRecord('+Number(r.id)+')">编辑</button><button class="link-btn del" onclick="deleteRecord('+Number(r.id)+')">删除</button></td>'
      +'</tr>';
  }).join('');
}

/* 导出数据：用自定义弹窗询问是否一起导出快递公司列表 */
async function exportToFile(){
  const list=loadData();
  if(!list.length){alert('当前没有记录可导出');return;}
  const couriers=loadCouriers();
  if(couriers.length>0){
    showCustomConfirm(
      '导出数据',
      '<div>是否将快递公司列表（共 <b>'+couriers.length+'</b> 家）一起导出？</div>'
      + '<div style="color:#64748b;font-size:13px;margin-top:8px;">「全部导出」= 记录 + 快递公司列表；「仅导出记录」= 只导出记录。</div>',
      function(){ doExportFile(list, couriers); },
      function(){ doExportFile(list, null); },
      '全部导出', '仅导出记录'
    );
    return;
  }
  doExportFile(list, null);
}
/* 导出核心：
 * 1) 桌面端（Tauri）→ 原生保存对话框，可自选路径
 * 2) 浏览器预览 → Blob 下载，自动落盘到默认下载目录
 * 3) 最后兜底 → 复制到剪贴板
 */
async function doExportFile(list, couriers){
  let payload = list;
  if(couriers && couriers.length){ payload = {records:list, couriers:couriers}; }
  const jsonStr=JSON.stringify(payload,null,2);
  const filename='express_backup_'+new Date().toISOString().slice(0,10)+'.json';

  // 1) 桌面端：原生保存对话框
  if(window.__TAURI__){
    try{
      const T=window.__TAURI__;
      if(T?.dialog?.save && T?.fs?.writeTextFile){
        const path=await T.dialog.save({defaultPath:filename,filters:[{name:'JSON 备份文件',extensions:['json']}]});
        if(!path)return;
        await T.fs.writeTextFile(path,jsonStr);
        alert('✅ 导出成功！\n文件已保存到：\n'+path);
        return;
      }
    }catch(e){console.warn('原生保存失败，将降级为浏览器下载',e);}
  }

  // 2) 浏览器预览：Blob 下载
  try{
    const blob=new Blob([jsonStr],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    alert('✅ 导出成功！\n文件已开始下载：'+filename);
    return;
  }catch(e){console.warn('浏览器下载失败，将降级为剪贴板方案',e);}

  // 3) 最后兜底：复制到剪贴板
  try{
    await navigator.clipboard.writeText(jsonStr);
    alert('当前环境无法直接保存文件，已将数据完整复制到剪贴板。\n\n请打开记事本，粘贴（Ctrl+V），然后保存为 .json 文件即可。');
  }catch(err){copyBackup();}
}

/* 导入数据：用自定义弹窗做覆盖确认 */
function importFromFile(event){
  const fileInput=event.target;
  const file=fileInput.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    let records=null, importedCouriers=null;
    try{
      const imported=JSON.parse(e.target.result);
      if(Array.isArray(imported)){
        records=imported;
      }else if(imported && typeof imported==='object' && Array.isArray(imported.records)){
        records=imported.records;
        if(Array.isArray(imported.couriers)){
          importedCouriers=imported.couriers
            .filter(x=>typeof x==='string' && x.trim())
            .map(x=>x.trim());
        }
      }else{
        throw new Error('文件内容格式不正确');
      }
      if(!records) throw new Error('文件中没有记录数据');
    }catch(err){
      alert('导入失败：'+(err.message||'文件格式不正确，请选择本软件导出的 .json 备份文件。'));
      fileInput.value='';
      return;
    }
    fileInput.value='';
    const runImport=function(){ doImport(records, importedCouriers); };
    const currentCount=loadData().length;
    if(currentCount>0){
      showCustomConfirm(
        '导入数据',
        '<div>导入会<span class="modal-highlight">覆盖</span>当前软件里的 '+currentCount+' 条记录，确定继续吗？</div>'
        + '<div style="color:#64748b;font-size:13px;margin-top:8px;">建议先点击「导出数据」备份当前记录。</div>',
        runImport, null, '确定导入', '取消'
      );
    }else{
      runImport();
    }
  };
  reader.readAsText(file,'UTF-8');
}
function doImport(records, importedCouriers){
  const normalized=records.map(r=>({
    id:Number(r.id)||0,
    count:Number(r.count)||1,
    courier:r.courier||r.company||'',
    province:r.province||'',
    city:r.city||'',
    district:r.district||r.area||'',
    street:r.street||r.address||'',
    duration:r.duration||'1天',
    period:r.period||'上午',
    keyword:r.keyword||r.remark||'',
    createdAt:r.createdAt||r.createTime||'',
    updatedAt:r.updatedAt||r.updateTime||''
  }));
  normalized.forEach((r,i)=>{r.id=i+1;});
  saveData(normalized);
  const existCouriers=loadCouriers();
  let changed=false;
  if(importedCouriers){
    importedCouriers.forEach(name=>{
      if(name && !existCouriers.includes(name)){ existCouriers.push(name); changed=true; }
    });
  }
  normalized.forEach(r=>{
    const name=(r.courier||'').trim();
    if(name && !existCouriers.includes(name)){ existCouriers.push(name); changed=true; }
  });
  if(changed) saveCouriers(existCouriers);
  editingId=null;
  refreshCourierOptions();
  refreshDurationOptions();
  updateEditUI();
  resortRegionSelects();
  refreshAll();
  alert('导入成功，共 '+normalized.length+' 条记录。'+(importedCouriers?'\n已恢复 '+importedCouriers.length+' 家快递公司。':''));
}
